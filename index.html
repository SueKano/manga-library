<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Catálogo personal de manga, 100% offline." />
    <meta name="theme-color" content="#f6f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0f12" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="./favicon.ico" sizes="48x48" />
    <link rel="icon" href="./logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon-180x180.png" />
    <title>Mi colección de manga</title>
    <script>
      // Apply the saved theme before the first paint to avoid a flash (see src/composables/useTheme.ts).
      try {
        const savedTheme = localStorage.getItem('theme')
        if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.dataset.theme = savedTheme
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
